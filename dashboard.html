<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>QuotePilot Client Dashboard</title>
<style>:root{--bg:#0b0b0c;--p:#151518;--g:#d6ae58;--t:#f7f3ea;--m:#aaa6a0;--l:#29292f;--ok:#8be4a8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif;line-height:1.5}.w{width:min(1100px,calc(100% - 28px));margin:auto}.nav{border-bottom:1px solid var(--l);padding:17px 0}.brand{font-weight:900}.brand b{color:var(--g)}main{padding:38px 0 70px}.top{display:flex;justify-content:space-between;gap:15px;align-items:end;margin-bottom:22px}.muted{color:var(--m)}h1{font-size:clamp(2.2rem,6vw,4rem);margin:0;letter-spacing:-.04em}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-block;background:var(--g);color:#111;border:1px solid var(--g);padding:11px 16px;border-radius:999px;font-weight:900;text-decoration:none;cursor:pointer}.btn.alt{background:transparent;color:var(--g)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card,.lead{background:var(--p);border:1px solid var(--l);border-radius:17px;padding:18px}.metric strong{display:block;font-size:1.8rem;color:var(--g)}.metric span{color:var(--m);font-size:.85rem}.leadList{display:grid;gap:12px}.leadHead{display:flex;justify-content:space-between;gap:12px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0}.chip{border:1px solid var(--l);border-radius:999px;padding:5px 9px;font-size:.78rem;color:#ddd}.contact{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.contact div{background:#0f0f11;border:1px solid var(--l);border-radius:10px;padding:10px;word-break:break-word}.estimate{font-weight:900;color:var(--g)}.empty,.loading,.error{padding:34px;text-align:center;color:var(--m);background:var(--p);border:1px dashed var(--l);border-radius:17px}.error{color:#ff9b9b}.secure{font-size:.82rem;color:var(--m);margin-top:18px}@media(max-width:760px){.top,.leadHead{flex-direction:column;align-items:flex-start}.metrics{grid-template-columns:1fr 1fr}.contact{grid-template-columns:1fr}}@media(max-width:430px){.metrics{grid-template-columns:1fr}}</style>
</head>
<body><div class="nav"><div class="w"><div class="brand">M&I <b>QuotePilot</b> · Client Dashboard</div></div></div><main><div class="w"><div id="loading" class="loading">Loading your QuotePilot dashboard...</div><div id="error" class="error" style="display:none"></div><div id="app" style="display:none"><div class="top"><div><div style="color:#d6ae58;font-weight:900;font-size:.8rem;letter-spacing:.1em">CLIENT DASHBOARD</div><h1 id="businessName">QuotePilot</h1><p id="sub" class="muted"></p></div><div class="actions"><a id="quoteBtn" class="btn" target="_blank" rel="noopener">Open QuotePilot</a><button class="btn alt" onclick="load()">Refresh</button></div></div><div class="metrics"><div class="card metric"><strong id="mTotal">0</strong><span>Total leads</span></div><div class="card metric"><strong id="mNew">0</strong><span>New</span></div><div class="card metric"><strong id="mQualified">0</strong><span>Qualified</span></div><div class="card metric"><strong id="mWon">0</strong><span>Won</span></div></div><div id="leadList" class="leadList"></div><p class="secure">Keep this dashboard link private. Anyone with the full link can access this business dashboard.</p></div></div></main>
<script>
const API='https://ujnzzyrgbxrpimavxiyz.supabase.co/functions/v1/quote-pilot-client-portal';const token=new URLSearchParams(location.search).get('token')||'';const money=c=>c==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(c/100);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function load(){loading.style.display='block';error.style.display='none';try{const r=await fetch(API+'?token='+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw new Error(d.inactive?'Your QuotePilot subscription is inactive.':'This dashboard link is invalid or unavailable.');const rows=d.leads||[];businessName.textContent=d.client.business_name;sub.textContent=(d.client.service_type||'Service business')+(d.client.service_area?' · '+d.client.service_area:'')+' · '+String(d.client.plan||'plan').toUpperCase();quoteBtn.href=d.client.quote_url;mTotal.textContent=rows.length;mNew.textContent=rows.filter(x=>x.status==='new').length;mQualified.textContent=rows.filter(x=>x.status==='qualified').length;mWon.textContent=rows.filter(x=>x.status==='won').length;leadList.innerHTML=rows.length?rows.map(r=>`<article class="lead"><div class="leadHead"><div><h3 style="margin:0">${esc(r.name)}</h3><span class="muted">${new Date(r.created_at).toLocaleString()}</span></div><div class="estimate">${money(r.estimate_low_cents)} – ${money(r.estimate_high_cents)}</div></div><div class="meta"><span class="chip">${esc(r.project_type||'Service')}</span><span class="chip">${esc(r.project_size||'Size n/a')}</span><span class="chip">${esc(r.urgency||'Urgency n/a')}</span><span class="chip">${esc(r.status||'new')}</span></div><div class="contact"><div><b>Phone</b><br>${esc(r.phone||'—')}</div><div><b>Email</b><br>${esc(r.email||'—')}</div></div>${r.details?`<div class="muted"><b style="color:#f7f3ea">Project:</b> ${esc(r.details)}</div>`:''}</article>`).join(''):'<div class="empty">No leads yet. When a customer submits your QuotePilot form, the lead will appear here automatically.</div>';loading.style.display='none';app.style.display='block'}catch(e){loading.style.display='none';app.style.display='none';error.textContent=e.message;error.style.display='block'}}load();
</script></body></html>
